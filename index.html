<style>
:root{--f:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#3ab8e0;font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{display:block}
.stroke{text-shadow:0 3px 0 #1b4f8a,2px 0 0 #1b4f8a,-2px 0 0 #1b4f8a,0 -2px 0 #1b4f8a,2px 2px 0 #1b4f8a,-2px 2px 0 #1b4f8a,2px -2px 0 #1b4f8a,-2px -2px 0 #1b4f8a,0 6px 10px rgba(0,30,80,.35)}

  text-shadow:0 5px 0 #ff8a1f,0 9px 0 #c6461a,4px 0 0 #c6461a,-4px 0 0 #c6461a,0 -4px 0 #c6461a,0 14px 18px rgba(0,40,90,.45);animation:bob 2.4s ease-in-out infinite}

#sub{position:absolute;top:calc(3vh + min(11vw,104px) + 22px);left:0;right:0;text-align:center;font-size:22px;font-weight:700}
#cards{position:absolute;left:0;right:0;bottom:3vh;height:31vh;pointer-events:none}
.card{position:absolute;bottom:0;width:15.5vw;min-width:150px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(220,246,255,.95));color:#1b4f8a;border-radius:22px;
  border:4px solid #fff;box-shadow:0 6px 0 #1b4f8a,0 10px 24px rgba(0,40,90,.35);padding:10px 12px 12px;pointer-events:auto;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover,.card.sel{transform:translateX(-50%) translateY(-8px) scale(1.04);box-shadow:0 6px 0 #1b4f8a,0 0 0 5px #ffe14d,0 14px 30px rgba(0,40,90,.4)}

.bar{display:flex;align-items:center;font-size:12px;font-weight:700;margin:3px 0}
.bar b{width:58px}
.bar i{flex:1;height:9px;border-radius:9px;background:#cfe7f5;overflow:hidden;position:relative}

#pBurg{top:16px;left:16px;padding:6px 18px 6px 12px;font-size:28px}

const timeU = { value:0 };

const grad = new THREE.DataTexture(new Uint8Array([110,110,110,255, 190,190,190,255, 255,255,255,255]),3,1);
grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true;
const matCache={};
function M(c){ if(!matCache[c]){ matCache[c]=new THREE.MeshToonMaterial({color:c, gradientMap:grad}); matCache[c].userData.flat=true; } return matCache[c]; }

const omCache={};

    vertexShader:`uniform float th;
#include <fog_pars_vertex>
void main(){
  vec4 wp = vec4(position + normal*th, 1.0);
#ifdef USE_INSTANCING
  wp = instanceMatrix * wp;
#endif

  gl_Position = projectionMatrix * mvPosition;

}`,
    fragmentShader:`uniform vec3 col;
#include <fog_pars_fragment>
void main(){

#include <fog_fragment>
}` });

const ogCache = new Map();
function outlineGeo(g){ let o=ogCache.get(g); if(o) return o; let p=new THREE.BufferGeometry(); p.setAttribute('position', g.attributes.position.clone()); if(g.index) p.setIndex(g.index.clone()); p=mergeVertices(p,1e-3); p.computeVertexNormals(); ogCache.set(g,p); return p; }
function mk(geo, color, o={}){
  const mat = (color && color.isMaterial) ? color : M(color);
  const m = new THREE.Mesh(geo, mat);
  if(o.p) m.position.set(...o.p); if(o.r) m.rotation.set(...o.r);
  let sAvg=1; if(o.s!==undefined){ if(Array.isArray(o.s)){ m.scale.set(...o.s); sAvg=(o.s[0]+o.s[1]+o.s[2])/3; } else { m.scale.setScalar(o.s); sAvg=o.s; } }
  const th = o.o===undefined?0.035:o.o;
  if(th>0){ const ol=new THREE.Mesh(outlineGeo(geo), OM(th/sAvg)); ol.userData.isOutline=true; m.add(ol); }
  if(o.parent) o.parent.add(m);

const SPH=new THREE.SphereGeometry(1,28,18), HEMI=new THREE.SphereGeometry(1,28,12,0,PI*2,0,PI/2), CYL=new THREE.CylinderGeometry(1,1,1,24), CONE=new THREE.ConeGeometry(1,1,20);
const RBOX=new RoundedBoxGeometry(1,1,1,4,0.18), SMILE=new THREE.TorusGeometry(0.16,0.035,8,20,PI), RING=new THREE.TorusGeometry(1,0.18,10,28), CAPS=new THREE.CapsuleGeometry(1,2,6,14);
const DODE=new THREE.DodecahedronGeometry(1,1);

const VCMAT = toon({ color:0xffffff, vertexColors:true });
const OM0 = OM(0.0);
function bake(root){
  root.updateMatrixWorld(true);
  const B = new Map();
  const put=(k,mat,g)=>{ if(!B.has(k)) B.set(k,{mat,geos:[]}); B.get(k).geos.push(g); };
  const strip=(g,keep)=>{ for(const a of Object.keys(g.attributes)) if(!keep.includes(a)) g.deleteAttribute(a); return g; };
  root.traverse(o=>{
    if(!o.isMesh) return;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    if(o.userData.isOutline){
      const th=o.material.uniforms.th.value, p=g.attributes.position, n=g.attributes.normal;
      for(let i=0;i<p.count;i++) p.setXYZ(i, p.getX(i)+n.getX(i)*th, p.getY(i)+n.getY(i)*th, p.getZ(i)+n.getZ(i)*th);
      strip(g,['position','normal']); g.applyMatrix4(o.matrixWorld); put('ol',OM0,g);
    } else if(o.material.userData.flat){

  });
  for(const {mat,geos} of B.values()) scene.add(new THREE.Mesh(mergeGeometries(geos), mat));
}

// sky: sea surface with flower clouds
const skyMat = new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false, uniforms:{ t:timeU },
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform float t; varying vec3 vD;
  float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  void main(){
    vec3 d=normalize(vD); float h=d.y;
    vec3 low=vec3(0.30,0.76,0.90), top=vec3(0.62,0.93,1.0);
    vec3 col=mix(low, top, smoothstep(0.0,0.7,h));
    if(h>0.05){
      vec2 uv = d.xz/(h+0.25)*2.2 + vec2(t*0.02, t*0.013);
      vec2 cell=floor(uv), f=fract(uv)-0.5;
      float rnd=h21(cell);
      f += (vec2(h21(cell+3.1),h21(cell+7.7))-0.5)*0.35;
      float r=length(f), a=atan(f.y,f.x)+rnd*6.28+t*0.1*(rnd-0.5);
      float pet = 0.26+0.09*cos(5.0*a);
      float sz = 0.65+rnd*0.5;
      float fl = smoothstep(pet*sz+0.015, pet*sz-0.015, r);
      float ctr = smoothstep(0.075*sz,0.06*sz,r);
      vec3 pc = rnd<0.25? vec3(0.55,0.62,1.0) : rnd<0.5? vec3(0.72,0.96,0.55) : rnd<0.75? vec3(1.0,0.72,0.9) : vec3(0.68,0.88,1.0);
      float vis = step(0.35,h21(cell+11.0)) * smoothstep(0.05,0.3,h);
      col = mix(col, pc, fl*vis*0.85);
      col = mix(col, vec3(1.0,1.0,0.85), ctr*vis*0.8);
    }
    col += vec3(1.0,1.0,0.9)*pow(max(h,0.0),6.0)*0.35;
    gl_FragColor=vec4(col,1.0);
  }` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(900,48,24), skyMat); scene.add(sky);

const rayMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, fog:false,
  uniforms:{ t:timeU, ph:{value:0} },
  vertexShader:`varying float vh; varying float vr; void main(){ vh=(position.y+130.0)/260.0; vec3 n=normalize(normalMatrix*normal); vr=abs(n.z); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying float vh; varying float vr; uniform float t; uniform float ph; void main(){ float a = pow(vh,1.3)*smoothstep(0.0,0.25,vh)*pow(vr,3.0)*(0.55+0.45*sin(t*0.7+ph))*0.16; gl_FragColor=vec4(1.0,1.0,0.88,a); }` });
{ seed=99; const cg=new THREE.ConeGeometry(16,260,24,1,true);
  for(let i=0;i<11;i++){ const m=rayMat.clone(); m.uniforms.t=timeU; m.uniforms.ph={value:rr(0,6)}; const r=new THREE.Mesh(cg,m); const a=rr(0,PI*2), d=rr(20,230); r.position.set(Math.cos(a)*d,130,Math.sin(a)*d); r.rotation.set(rr(-0.18,0.18),0,rr(-0.18,0.18)); scene.add(r); } }

function sandTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'); x.fillStyle='#f2d59b'; x.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){ x.fillStyle=pick(['#e8c47f','#f7e2b2','#e2b974','#fbe9c2']); const s=1+Math.random()*3; x.beginPath(); x.arc(Math.random()*256,Math.random()*256,s,0,7); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(90,90); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
{
  const gg=new THREE.PlaneGeometry(1800,1800,90,90); gg.rotateX(-PI/2);
  const p=gg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i), r=Math.hypot(x,z); if(r>250){ const k=Math.min(1,(r-250)/150); p.setY(i, k*(8*Math.sin(x*0.02)*Math.cos(z*0.025)+6+k*20)); } }
  gg.computeVertexNormals();
  scene.add(new THREE.Mesh(gg, toon({ map:sandTex() })));
}
const R1=110, R2=215, RW=7, AV=235;
function roadDist(x,z){ const r=Math.hypot(x,z); let d=Math.min(Math.abs(r-R1),Math.abs(r-R2)); if(Math.abs(x)<AV) d=Math.min(d,Math.abs(z)); if(Math.abs(z)<AV) d=Math.min(d,Math.abs(x)); return d; }
const roadMat = toon({ color:0xfff3d1, polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-2 });
{
  const gs=[]; for(const R of [R1,R2]){ const g=new THREE.RingGeometry(R-RW,R+RW,160,1); g.rotateX(-PI/2); g.translate(0,0.04,0); gs.push(g); }
  for(const ax of [0,1]){ const g=new THREE.PlaneGeometry(RW*2,AV*2); g.rotateX(-PI/2); if(ax) g.rotateY(PI/2); g.translate(0,0.05,0); gs.push(g); }
  for(const g of gs){ g.deleteAttribute('uv'); }
  scene.add(new THREE.Mesh(mergeGeometries(gs.map(g=>g.index?g.toNonIndexed():g)), roadMat));
  const pts=[]; seed=5;
  for(const R of [R1,R2]) for(const s of [-1,1]){ const rad=R+s*(RW+0.6), n=Math.floor(PI*2*rad/2.6); for(let i=0;i<n;i++){ const a=i/n*PI*2; const x=Math.cos(a)*rad, z=Math.sin(a)*rad; if(Math.abs(x)<RW+1.5||Math.abs(z)<RW+1.5) continue; pts.push([x,z]); } }
  for(const s of [-1,1]) for(let t=-AV;t<=AV;t+=2.6){ for(const [x,z] of [[s*(RW+0.6),t],[t,s*(RW+0.6)]]){ if(Math.abs(x)<RW+1.5&&Math.abs(z)<RW+1.5) continue; const r=Math.hypot(x,z); if(Math.abs(r-R1)<RW+1.5||Math.abs(r-R2)<RW+1.5) continue; pts.push([x,z]); } }
  const pg=new THREE.SphereGeometry(1,10,6);
  const im=new THREE.InstancedMesh(pg, toon({color:0xffffff}), pts.length), ol=new THREE.InstancedMesh(outlineGeo(pg), OM(0.12), pts.length);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), c=new THREE.Color(), cols=[0xff9ec7,0xa0e7ff,0xfff1a8,0xc9b6ff,0xffffff,0xff8f70];
  pts.forEach(([x,z],i)=>{ const s=rr(0.45,0.75); q.setFromEuler(new THREE.Euler(0,rr(0,6),0)); m.compose(new V3(x,0.1,z),q,new V3(s,s*0.6,s)); im.setMatrixAt(i,m); im.setColorAt(i,c.setHex(pick(cols))); });
  ol.instanceMatrix=im.instanceMatrix; scene.add(im,ol);
}
const caustMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
  uniforms:{ t:timeU, cam:{value:new V3()} },
  vertexShader:`varying vec3 wp; void main(){ vec4 w=modelMatrix*vec4(position,1.0); wp=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform float t; uniform vec3 cam; varying vec3 wp;
  void main(){

  g.strokeStyle='#9d7f95'; g.lineWidth=6; g.beginPath(); g.arc(0,0,262*MS,0,7); g.stroke(); }
function drawMap(){ mc.clearRect(0,0,170,170); mc.drawImage(mapBg,0,0); mc.save(); mc.translate(85,85);
  burgers.forEach(b=>{ if(b.done) return; mc.fillStyle='#ffb52e'; mc.strokeStyle='#8a4a24'; mc.lineWidth=1; mc.beginPath(); mc.arc(b.p.x*MS,b.p.z*MS,3,0,7); mc.fill(); mc.stroke(); });
  rings.forEach(r=>{ if(r.done) return; mc.strokeStyle='#2e9be0'; mc.lineWidth=2; mc.beginPath(); mc.arc(r.p.x*MS,r.p.z*MS,3.5,0,7); mc.stroke(); });
  mc.translate(P.pos.x*MS,P.pos.z*MS); mc.rotate(PI-P.yaw); mc.fillStyle='#ff5a5f'; mc.strokeStyle='#fff'; mc.lineWidth=2; mc.beginPath(); mc.moveTo(0,-7); mc.lineTo(5.5,6); mc.lineTo(-5.5,6); mc.closePath(); mc.fill(); mc.stroke(); mc.restore(); }
function hud(){ $('burg').textContent=got; $('score').textContent=score; const te=$('pTime'); te.textContent='⏱ '+Math.ceil(timeLeft); te.className='pill'+(timeLeft<15?' low':'');
  $('spd').textContent=Math.round(Math.abs(P.speed)*3.6); const m=$('pMode'); m.textContent=P.mode==='fly'?'🫧 FLY · '+Math.round(P.pos.y)+' m':'🚗 DRIVE'; m.className='pill'+(P.mode==='fly'?' fly':''); }
// main loop
let last=performance.now();
const cards=[...document.querySelectorAll('.card')];
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.1,(now-last)/1000); last=now; clock+=dt; timeU.value=clock;
  if(state==='play') update(dt);
  updateJellies(clock,dt); updateFish(clock); updateParticles(dt);
  burgers.forEach((b,i)=>{ if(b.pop>0) b.pop=Math.max(0,b.pop-dt*4); const vis=!b.done||b.pop>0; const s=b.done? b.pop*1.6 : 1+Math.sin(clock*4+b.ph)*0.06;
    _q.setFromEuler(_e.set(0.15,clock*2+b.ph,0)); _m.compose(tmp.copy(b.p).setY(b.p.y+Math.sin(clock*2+b.ph)*0.4), _q, _s.setScalar(vis?s*1.15:0.0001)); burgIM.setMatrixAt(i,_m); burgGlow[i].visible=!b.done; burgGlow[i].material.opacity=0.6+Math.sin(clock*4+b.ph)*0.25; });
  burgIM.instanceMatrix.needsUpdate=true;
  rings.forEach(r=>{ if(r.done){ if(r.pop>0){ r.pop=Math.max(0,r.pop-dt*3); r.g.scale.setScalar(1+(1-r.pop)*0.8); if(r.pop===0) r.g.visible=false; } return; } r.g.children[0].rotation.z=clock*0.6; r.g.scale.setScalar(1+Math.sin(clock*3)*0.04); });
  if(state==='select'){ stageChars.forEach((c,i)=>{ c.userData.anim(clock+i*1.7); const s=i===sel; const tgt=s?1.12:0.95; c.scale.setScalar(lerp(c.scale.x,tgt,Math.min(1,dt*8))); c.position.y=0.5+(s?Math.abs(Math.sin(clock*4))*0.25:0); c.rotation.y=s?Math.sin(clock*1.5)*0.3:0; pedGlow[i].material.opacity=s?0.7+Math.sin(clock*5)*0.25:0; });
    cards.forEach((d,i)=>d.classList.toggle('sel',i===sel)); }
  updateCar(clock,dt);
  updateCamera(dt,clock);
  updateBubbles(clock,dt, state==='play'&&car ? P.pos : camera.position);
  sky.position.copy(camera.position); caust.position.x=Math.round(camera.position.x/22)*22; caust.position.z=Math.round(camera.position.z/22)*22; caustMat.uniforms.cam.value.copy(camera.position);
  if(state==='play'){ hud(); drawMap(); }
  if(ac && eng){ const t=ac.currentTime, sp=Math.abs(P.speed), on=state==='play'&&!muted; eng.o.frequency.setTargetAtTime(70+sp*3+(P.mode==='fly'?40:0),t,0.08); eng.o2.frequency.setTargetAtTime(35+sp*1.5,t,0.08); eng.f.frequency.setTargetAtTime(300+sp*20,t,0.1); eng.g.gain.setTargetAtTime(on?0.05+sp*0.001:0,t,0.15); }
  updateMusic();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
window.__reefReady=true;
